<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f5">
  <meta name="description" content="Forma CV — create a polished, ATS-friendly CV in Arabic or English. Private by design: your data stays on your device.">
  <title>Forma CV | Resume builder</title>
  <script>
    /* Apply theme + direction before first paint (no flash). */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('forma:v2:prefs') || '{}');
        var theme = p.theme || 'system';
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var lang = p.uiLang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
        document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap">
